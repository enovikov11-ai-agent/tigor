<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Chat Export</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #222;
      padding: 32px 16px;
    }
    h1 { text-align: center; font-size: 20px; margin-bottom: 20px; color: #111; }
    input[type=file] { display: none; }
    .pick {
      display: block;
      margin: 0 auto 12px;
      padding: 10px 22px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      color: #333;
      cursor: pointer;
      font-size: 14px;
    }
    .pick:hover { background: #f0f0f0; }
    .filters {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .filters select {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font-size: 14px;
      min-width: 110px;
    }
    .filters select:disabled { opacity: 0.4; cursor: default; }
    #info { text-align: center; font-size: 13px; color: #888; margin-bottom: 24px; }
    #chart { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .month {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px 14px 8px;
      display: flex;
      align-items: flex-end;
    }
    .month-title {
      flex-shrink: 0;
      width: 76px;
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      text-align: right;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }
    .bars {
      display: flex;
      align-items: flex-end;
      flex: 1;
      height: 130px;
      gap: 1px;
    }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    .bar {
      width: 100%;
      max-width: 14px;
      border-radius: 4px 4px 2px 2px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      background: #216aab;
      min-height: 3px;
    }
    .bar:hover { opacity: 0.8; }
    .bar .val { margin-top: 2px; }
    .day-num {
      font-size: 9px;
      color: #bbb;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h1>Telegram Chat Export</h1>
  <label class="pick">
    Pick a JSON file
    <input type="file" accept=".json">
  </label>
  <div class="filters">
    From:
    <select id="fStart" disabled><option value="">—</option></select>
    <span style="color:#aaa">→</span>
    To:
    <select id="fEnd" disabled><option value="">—</option></select>
  </div>
  <div id="info"></div>
  <div id="chart"></div>

<script>
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var ALL_MONTHS_DATA = null;
var ALL_MONTH_KEYS = null;

document.querySelector('input[type=file]').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var data = JSON.parse(ev.target.result);
    initFilters(data);
  };
  reader.readAsText(file);
});

function initFilters(data) {
  var msgs = data.messages || [];
  var dayCounts = {};
  for (var i = 0; i < msgs.length; i++) {
    var m = msgs[i];
    if (!m.date) continue;
    var day = m.date.substring(0, 10);
    dayCounts[day] = (dayCounts[day] || 0) + 1;
  }
  var allDays = Object.keys(dayCounts).sort();
  if (allDays.length === 0) return;

  var months = {};
  for (var k in dayCounts) {
    var key = k.substring(0, 7);
    if (!months[key]) months[key] = {};
    var d = parseInt(k.substring(8));
    months[key][d] = dayCounts[k];
  }
  ALL_MONTHS_DATA = months;

  var totalMsgs = 0;
  for (var k in dayCounts) totalMsgs += dayCounts[k];

  // Populate dropdowns
  var monthKeys = Object.keys(months).sort();
  var fStart = document.getElementById('fStart');
  var fEnd = document.getElementById('fEnd');
  fStart.innerHTML = '';
  fEnd.innerHTML = '';
  fStart.disabled = false;
  fEnd.disabled = false;

  for (var yi = 0; yi < monthKeys.length; yi++) {
    var mk = monthKeys[yi];
    var label = MONTHS[parseInt(mk.split('-')[1]) - 1] + ' ' + mk.split('-')[0];
    fStart.add(new Option(label, mk));
    fEnd.add(new Option(label, mk));
  }

  // Default: earliest month for start, latest for end
  fStart.value = monthKeys[0];
  fEnd.value = monthKeys[monthKeys.length - 1];

  // Listen for changes
  [fStart, fEnd].forEach(function(sel) {
    sel.addEventListener('change', function() { renderFiltered(data); });
  });

  renderFiltered(data);
}

function renderFiltered(data) {
  var months = ALL_MONTHS_DATA;
  if (!months) return;

  var startKey = document.getElementById('fStart').value;
  var endKey = document.getElementById('fEnd').value;

  // Collect visible month keys (all months between start and end, inclusive)
  var allKeys = Object.keys(months).sort();
  var visibleKeys = [];
  for (var i = 0; i < allKeys.length; i++) {
    if (allKeys[i] >= startKey && allKeys[i] <= endKey) {
      visibleKeys.push(allKeys[i]);
    }
  }
  visibleKeys.reverse(); // DESC order

  if (visibleKeys.length === 0) {
    document.getElementById('info').textContent = 'No data in selected range.';
    document.getElementById('chart').innerHTML = '';
    return;
  }

  // Calculate max only over visible range
  var maxCount = 0;
  for (var vi = 0; vi < visibleKeys.length; vi++) {
    var counts = months[visibleKeys[vi]];
    for (var d in counts) {
      if (counts[d] > maxCount) maxCount = counts[d];
    }
  }
  if (maxCount === 0) maxCount = 1;

  // Count total msgs in visible range
  var totalVisible = 0;
  var activeDays = 0;
  for (vi = 0; vi < visibleKeys.length; vi++) {
    var ccounts = months[visibleKeys[vi]];
    for (var dd in ccounts) {
      activeDays++;
      totalVisible += ccounts[dd];
    }
  }

  document.getElementById('info').textContent =
    (data.name || '') + ' — ' + activeDays + ' days, ' + totalVisible + ' msgs, max ' + maxCount + '/day (in range)';

  var container = document.getElementById('chart');
  container.innerHTML = '';

  for (var mi = 0; mi < visibleKeys.length; mi++) {
    var key = visibleKeys[mi];
    var parts = key.split('-');
    var year = parts[0];
    var monthNum = parseInt(parts[1]);
    var dim = new Date(parseInt(year), monthNum, 0).getDate();
    var counts = months[key];

    var monthDiv = document.createElement('div');
    monthDiv.className = 'month';

    var title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = MONTHS[monthNum - 1] + ' ' + year;
    monthDiv.appendChild(title);

    var barsRow = document.createElement('div');
    barsRow.className = 'bars';

    // Rainbow colors for Mon(0)–Sun(6): red, orange, yellow, green, blue, indigo, violet
    var weekColors = [
      'hsl(0, 75%, 55%)',    // Mon  red
      'hsl(30, 80%, 55%)',   // Tue  orange
      'hsl(55, 80%, 50%)',   // Wed  yellow
      'hsl(130, 60%, 48%)',  // Thu  green
      'hsl(210, 70%, 52%)',  // Fri  blue
      'hsl(255, 65%, 52%)',  // Sat  indigo
      'hsl(300, 60%, 55%)'   // Sun  violet
    ];

    for (var day = 1; day <= dim; day++) {
      var c = counts[day] || 0;
      var h = Math.max(3, (c / maxCount) * 127 + 3);

      // JS Date: 0=Sun,1=Mon,...,6=Sat  →  map to Mon=0 .. Sun=6
      var jsDow = new Date(parseInt(year), monthNum - 1, day).getDay();
      var dowIdx = (jsDow + 6) % 7; // Mon→0, Tue→1, …, Sun→6

      var col = document.createElement('div');
      col.className = 'col';

      var bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = h + 'px';
      if (c > 0) {
        bar.style.background = weekColors[dowIdx];
        var num = document.createElement('span');
        num.className = 'val';
        num.textContent = c;
        bar.appendChild(num);
      } else {
        bar.style.background = 'transparent';
        bar.style.borderBottom = '1px solid #e8e8e8';
        bar.style.borderRadius = '0';
      }
      col.appendChild(bar);

      var dn = document.createElement('div');
      dn.className = 'day-num';
      dn.textContent = day;
      col.appendChild(dn);

      barsRow.appendChild(col);
    }

    monthDiv.appendChild(barsRow);
    container.appendChild(monthDiv);
  }
}
</script>
</body>
</html>
