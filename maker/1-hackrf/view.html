<!DOCTYPE html>
<html>

<head></head>

<body>
    <div id="stat" style="font-size: 20px;">move mouse</div>
    <script>
        const data = { "10": -50.27, "11": -50.03, ...

        const stat = document.querySelector("#stat");
        const start = Math.min(...Object.values(data)), end = Math.max(...Object.values(data));
        const scale = 10;

        for (let [k, v] of Object.entries(data)) {
            const div = document.createElement("div");
            div.style.position = "absolute";
            div.style.left = scale * ((+k) % 100) + "px";
            div.style.top = 40 + scale * Math.floor((+k) / 100) + "px";
            div.style.width = scale + "px";
            div.style.height = scale + "px";

            const color = Math.floor(255 * (v - start) / (end - start));
            const pct = Math.floor(100 * (v - start) / (end - start));
            div.style.backgroundColor = `rgb(${color}, ${color}, ${color})`;

            div.setAttribute("data-mhz", k);
            div.setAttribute("data-dbfs", v);
            div.setAttribute("data-pct", pct);
            div.className = "box";

            document.body.appendChild(div);
        }

        document.addEventListener("mousemove", ({ target }) => {
            if (target.className == "box") {
                const mhz = target.getAttribute("data-mhz");
                const dbfs = target.getAttribute("data-dbfs");
                const pct = target.getAttribute("data-pct");

                stat.innerText = `${mhz}MHz ${dbfs}dBFS ${pct}%`;
            }
        });
    </script>
</body>

</html>
