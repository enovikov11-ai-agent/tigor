<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const ws = new WebSocket(
        location.href.replace("http://", "ws://") + "ws"
      );
      ws.onopen = console.log;

      const items = {};

      ws.onmessage = ({ data }) => {
        const { color, x, y } = JSON.parse(data);
        if (!items[color]) {
          items[color] = document.createElement("div");

          items[color].style.width = "30px";
          items[color].style.height = "30px";
          items[color].style.backgroundColor = color;
          items[color].style.borderRadius = "15px";
          items[color].style.position = "fixed";

          document.body.appendChild(items[color]);
        }

        items[color].style.left = x * 100 + "%";
        items[color].style.top = y * 100 + "%";
      };
      ws.onerror = ws.onclose = console.log;

      addEventListener("mousemove", ({ clientX, clientY }) => {
        ws.send(
          JSON.stringify({
            x: clientX / window.innerWidth,
            y: clientY / window.innerHeight
          })
        );
      });
    </script>
  </body>
</html>
