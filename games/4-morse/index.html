<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script>
            let pressedAt = 0;
            let code = 1;

            addEventListener("keydown", () => {
                pressedAt = Date.now();
            });

            addEventListener("keyup", () => {
                code *= 2;
                if (Date.now() - pressedAt > 120) { code++; }
            });

        </script>
    </body>
</html>
