version: "3.8"

services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:25565:25565"
      - "127.0.0.1:1337:1337"
    environment:
      TYPE: PAPER
      VERSION: "1.20.4"
      EULA: "TRUE"
      GAMEMODE: "creative"
      MEMORY: 1G
      LEVEL_TYPE: FLAT
      GENERATE_STRUCTURES: "false"
      SPAWN_ANIMALS: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_NPCS: "false"
      ONLINE_MODE: "FALSE"
    volumes:
      - ./server-data:/data
