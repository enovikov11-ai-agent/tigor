<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-size: 20px;
        }

        .border {
            user-select: none;
        }

        .cell {
            width: 40px;
            height: 40px;

            font-size: 50px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: default;
        }

        .border {
            font-size: 30px;
        }

        .row {
            display: flex;
            align-items: flex-start;
        }

        .light {
            background-color: #F0D9B5;
        }

        .dark {
            background-color: #B58863;
        }

        .light.selected {
            background-color: #FFFF99;
        }

        .dark.selected {
            background-color: #C8B900;
        }
    </style>
</head>

<body>
    <script>
        let gameState = "connecting";
        document.body.innerText = "Simple chess\nConnecting..";

        window.onerror = function (message, source, lineno, colno, error) {
            console.log({ message, source, lineno, colno, error });

            document.body.innerText = message;
            gameState = "error";

            return true;
        };

        function renderGame() {
            document.body.innerHTML = '<div id="game-status">Waiting for competitor to join, send them a link<br/><a></a></div>';

            const link = document.querySelector("#game-status a");
            link.href = link.innerText = location.href;

            const table = document.createElement("table");
            document.body.appendChild(table);
            table.classList.add("board");

            for (let i = 0; i < 10; i++) {
                const row = document.createElement("tr");
                table.appendChild(row);
                row.classList.add("row");

                for (let j = 0; j < 10; j++) {
                    const cell = document.createElement("td");
                    row.appendChild(cell);
                    cell.classList.add("cell");

                    const id = " abcdefgh "[j] + (9 - i)

                    if (i == 0 || i == 9) {
                        cell.classList.add("border");
                        if (0 < j && j < 9) cell.innerText = id[0];
                    } else if (j == 0 || j == 9) {
                        cell.classList.add("border");
                        if (0 < i && i < 9) cell.innerText = id[1];
                    } else {
                        cell.setAttribute("data-id", id);
                        cell.classList.add((i + j) % 2 == 0 ? "light" : "dark");

                        if (i == 1 || i == 8) {
                            cell.style.color = i == 1 ? "black" : "white";
                            cell.innerText = "♖♘♗♕♔♗♘♖"[j - 1];
                        } else if (i == 2 || i == 7) {
                            cell.style.color = i == 2 ? "black" : "white";
                            cell.innerText = "♙";
                        }
                    }
                }
            }
        }

        function getRandom(bytes) {
            const buffer = new Uint8Array(bytes);
            window.crypto.getRandomValues(buffer);
            return Array.from(buffer).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        addEventListener("click", event => {
            if (!event.target.classList.contains("cell")) return;

            const id = event.target.getAttribute("data-id");
            if (!id) return;

            ws.send("p" + id);
        });

        const queryParams = new URLSearchParams(window.location.search);

        // FIXME: disable debug always regen
        if (true || !localStorage.clientSecret) localStorage.clientSecret = getRandom(32);

        if (!queryParams.get("game")) {
            queryParams.set("game", getRandom(8));
            const newUrl = `${window.location.pathname}?${queryParams}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        const wsUrl = new URL((window.location.protocol === 'https:') ? 'wss://' : 'ws://' + window.location.host + '/ws');

        const wsQueryParams = new URLSearchParams();
        wsQueryParams.set("game", queryParams.get("game"));

        wsUrl.search = wsQueryParams.toString();

        const ws = new WebSocket(wsUrl.href);

        ws.onopen = () => {
            ws.send("s" + localStorage.clientSecret);
            renderGame();
        };

        let closeReason = "Connection lost, check internet and reload page"

        ws.onclose = ws.onerror = () => {
            gameState = "idle";
            document.body.innerText = closeReason;
        };

        ws.onmessage = ({ data }) => {
            const type = data[0], payload = data.substr(1);

            if (type == "c") {
                closeReason = payload;
            } else if (type == "s") {
                gameState = payload;

                const gameStatus = document.querySelector("#game-status");

                if (gameState == "white") {
                    gameStatus.innerText = "You are playing white";
                } else if (gameState == "black") {
                    gameStatus.innerText = "You are playing black";
                } else if (gameState == "spectator") {
                    gameStatus.innerText = "You are a spectator";
                }
            } else {
                console.log(data);
                closeReason = "Protocol error";
                ws.close();
            }
        };
    </script>
</body>

</html>
