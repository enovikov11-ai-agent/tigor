<body>
    <svg id="svg" width="600" height="600" xmlns="http://www.w3.org/2000/svg">
        <rect width="600" height="600" fill="black" />
    </svg>
    <script>
        const STEPS = 4, SPEED = 0.001, MUL = 0.1;

        function getObjectsState() {
            let total = [], line = [{ cx: 300, cy: 300, r: 280, b: 3, a: 0, ca: 1 }], nextLine = [], currentTime = Date.now();

            for (let i = 0; i < STEPS; i++) {
                for (let {cx, cy, r, b, a, ca} of line) {
                    let nBase = (a + currentTime * SPEED) * MUL;
                    let na = nBase;
                    nextLine.push({cx: cx + Math.sin(na) * r * 0.3, cy: cy + Math.cos(na) * r * 0.3, r: r * 0.7, b, a: na, ca: ca * MUL});

                    na = nBase + Math.atan2(84, -187);
                    nextLine.push({cx: cx + Math.sin(na) * r * (1 - 84 / 289), cy: cy + Math.cos(na) * r * (1 - 84 / 289), r: r * 84 / 289, b, a: na, ca: ca * MUL});

                    na = nBase - Math.atan2(84, -187)
                    nextLine.push({cx: cx + Math.sin(na) * r * (1 - 84 / 289), cy: cy + Math.cos(na) * r * (1 - 84 / 289), r: r * 84 / 289, b, a: na, ca: ca * MUL});
                }

                total.push(...line);
                line = nextLine;
                nextLine = [];
            }

            total.push(...line, ...nextLine);
            
            return total;
        }

        function animate() {
            const state = getObjectsState();

            for (let i = 0; i < count; i++) {
                circles[i].setAttribute('cx', state[i].cx);
                circles[i].setAttribute('cy', state[i].cy);
                circles[i].setAttribute('r', state[i].r);
                circles[i].setAttribute('stroke-width', state[i].b);
            }

            requestAnimationFrame(animate);
        }

        let svg = document.getElementById('svg'), circles = [], count = getObjectsState().length;

        for (let i = 0; i < count; i++) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('fill', 'none');
            circle.setAttribute('stroke', 'white');

            svg.appendChild(circle);
            circles.push(circle);
        }

        requestAnimationFrame(animate);
    </script>
</body>

</html>
